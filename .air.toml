#:schema https://json.schemastore.org/any.json

# Air configuration for Shareledger hot reload development
# https://github.com/air-verse/air

root    = "."
tmp_dir = "tmp"

[build]
# Build command
cmd = "go build -o ./tmp/shareledger ./cmd/Shareledgerd"
# Binary file to run
bin = "./tmp/shareledger"
# Arguments for running the binary
args_bin = [ "start", "--home", "/root/.shareledger-dev" ]
# Watch these directories
include_dir = [ "cmd", "app", "x", "ante", "pkg" ]
# Watch these file extensions
include_ext = [ "go", "tpl", "tmpl", "html" ]
# Exclude directories
exclude_dir = [
    "tmp",
    "vendor",
    "testutil",
    "tests",
    "build",
    "docs",
    "proto",
    "deploy"
]
# Exclude files matching these patterns
exclude_file = [  ]
# Exclude regex patterns
exclude_regex = [ "_test\\.go$", ".*_mock\\.go$" ]
# Exclude unchanged files
exclude_unchanged = true
# Follow symlinks
follow_symlink = false
# Log file path (empty means stdout)
log = ""
# Poll interval for file changes (milliseconds)
poll          = false
poll_interval = 500
# Delay before rebuilding (milliseconds)
delay = 1000
# Stop running old binary on rebuild
stop_on_error = true
# Send interrupt signal before killing (for graceful shutdown)
send_interrupt = true
# Delay before sending kill signal after interrupt (milliseconds)
kill_delay = 500
# Rerun binary on built error
rerun = false
# Delay between reruns
rerun_delay = 500

[log]
# Show timestamp in logs
time = true
# Log level: debug, info, warn, error
main_only = false

[color]
# Customize colors
build   = "yellow"
main    = "magenta"
runner  = "green"
watcher = "cyan"

[misc]
# Delete tmp directory on exit
clean_on_exit = true